name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One job creates the release (or finds it), then every build uploads into
  # that one. Letting each build create it raced: two of them found no release
  # for the tag at the same moment and each made its own draft, so a version
  # ended up split over two releases (0.15.9, 0.15.12). Publishing a draft
  # pushes its tag and runs this workflow again: the release is found, not
  # created twice — and, being published already, not rebuilt either.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ fromJSON(steps.release.outputs.result).id }}
      skip: ${{ fromJSON(steps.release.outputs.result).skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or find the release of this version
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { version } = JSON.parse(fs.readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            // A published release of the tag first, then a draft one.
            const mine = releases.filter((r) => r.tag_name === tag).sort((a, b) => Number(a.draft) - Number(b.draft));
            if (mine.length > 0) {
              const found = mine[0];
              // Publishing a draft pushes its tag, which lands here again:
              // that release is already built, so nothing is rebuilt. A run
              // started by hand (workflow_dispatch) always builds, to fill a
              // release a failed job left incomplete.
              if (!found.draft && context.eventName === 'push') {
                core.info(`${found.name} is already published: nothing to build.`);
                return { id: String(found.id), skip: 'true' };
              }
              core.info(`Uploading into the existing release ${found.name} (${found.draft ? 'draft' : 'published'}).`);
              return { id: String(found.id), skip: 'false' };
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `CortX ${tag}`,
              body: 'See the assets to download and install this version.',
              draft: true,
              prerelease: false,
            });
            core.info(`Created the draft release ${data.name}.`);
            return { id: String(data.id), skip: 'false' };

  publish-tauri:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon
            target: 'aarch64-apple-darwin'
            sidecar_ext: ''
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'  # Intel
            target: 'x86_64-apple-darwin'
            sidecar_ext: ''
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            sidecar_ext: ''
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            sidecar_ext: '.exe'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          # The runners point apt at Azure's mirror of Ubuntu, which sometimes
          # stops answering: every package then times out one after the other
          # and the step hangs for hours (0.15.12). The main archive instead,
          # with retries and a short timeout so a bad mirror fails fast.
          # The sources do not name the mirror themselves: they read it from
          # /etc/apt/apt-mirrors.txt (`mirror+file:`), so that list is what
          # has to change — rewriting the sources alone left apt on Azure.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Build cortx sidecars (TUI + MCP) — Unix
        if: matrix.platform != 'windows-latest'
        working-directory: frontend
        run: |
          cargo build --release --target ${{ matrix.target }} -p cortx-tui -p cortx-mcp
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/cortx${{ matrix.sidecar_ext }}" \
             "src-tauri/binaries/cortx-${{ matrix.target }}${{ matrix.sidecar_ext }}"
          cp "target/${{ matrix.target }}/release/cortx-mcp${{ matrix.sidecar_ext }}" \
             "src-tauri/binaries/cortx-mcp-${{ matrix.target }}${{ matrix.sidecar_ext }}"

      - name: Build cortx sidecars (TUI + MCP + shim launcher) — Windows
        if: matrix.platform == 'windows-latest'
        working-directory: frontend
        shell: pwsh
        run: |
          cargo build --release -p cortx-tui -p cortx-mcp -p cortx-shim
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item "target/release/cortx.exe" "src-tauri/binaries/cortx-${{ matrix.target }}.exe"
          Copy-Item "target/release/cortx-mcp.exe" "src-tauri/binaries/cortx-mcp-${{ matrix.target }}.exe"
          Copy-Item "target/release/cortx-shim.exe" "src-tauri/binaries/cortx-shim-${{ matrix.target }}.exe"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: bunx tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v__VERSION__
          args: ${{ matrix.args }}
